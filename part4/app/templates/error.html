{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel">
  <h2>{{ title }}</h2>
  <p>{{ message }}</p>
  {% if detail %}<p class="mono small muted">{{ detail }}</p>{% endif %}
  <p><a href="{{ url_for('dashboard.index') }}">Return to the dashboard</a></p>
</div>
{% endblock %}
